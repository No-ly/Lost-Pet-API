services: 
  db: 
    image: postgis/postgis:16-master 
    container_name: petradar_db 
    restart: always 
    environment: 
      POSTGRES_DB: ${DB_NAME} 
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
    ports: 
      - "${DB_PORT}:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
    
  redis: 
    image: redis:alpine 
    container_name: petradar_redis 
    restart: always 
    ports:
      - "6379:6379" 

volumes: 
  postgres_data: